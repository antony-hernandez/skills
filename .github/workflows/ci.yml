name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar manifiestos
        run: python3 scripts/validate.py

      - name: Exigir bump de version en los plugins tocados
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/validate.py "origin/${{ github.base_ref }}"
